name: Build Userscripts

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install TypeScript and esbuild
        run: |
          npm install -g typescript
          npm install -g esbuild

      - name: Build all submodules
        run: |
          rm -r dist || true
          mkdir dist

          submodules=("assignments" "discussions" "homepage" "modules" "pages" "task_bar")

          for m in "${submodules[@]}"; do
            cd $m

            rm -r out dist &> /dev/null || true
            mkdir out dist

            tsc --pretty --strict --removeComments
            esbuild --bundle out/index.js --outfile=dist/user.js --banner:js="$(cat info.txt)"

            cp dist/user.js ../dist/$m.js
            rm -r out dist &> /dev/null || true

            cd ..
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userscripts
          path: dist/
